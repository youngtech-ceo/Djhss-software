<script>
    function fetchClassReport() {
        const selectedClass = document.getElementById("class-select").value;
        const examType = document.getElementById("exam-type").value;
        const sections = ["A", "A1", "B", "C", "D", "E", "F"]; // Modify if needed
    
        if (!selectedClass || !examType) {
            alert("Please select a class and exam type.");
            return;
        }
    
        const reportTableBody = document.getElementById("report-table-body");
        reportTableBody.innerHTML = "<tr><td colspan='7'>Loading...</td></tr>";
    
        let totalStudents = 0;
        let presentStudents = 0;
        let absentStudents = 0;
        let totalPasses = 0;
        let totalFails = 0;
    
        const percentageRanges = {
            between0And35: 0,
            between36And60: 0,
            between61And80: 0,
            between81And90: 0,
            between91And99: 0,
            hundred: 0
        };
    
        const sectionReports = [];
    
        Promise.all(
            sections.map(section =>
                database
                    .ref(`students/${selectedClass}/${section}/${examType}`)
                    .once("value")
                    .then(snapshot => {
                        const marksData = snapshot.val();
                        if (!marksData) {
                            console.log(`No data found for section: ${section}`);
                            return null;
                        }
    
                        let sectionTotal = marksData.length || 0;
                        let sectionAbsent = 0;
                        let sectionPresent = 0;
                        let sectionPasses = 0;
                        let sectionFails = 0;
    
                        let sectionPercentageRanges = {
                            between0And35: 0,
                            between36And60: 0,
                            between61And80: 0,
                            between81And90: 0,
                            between91And99: 0,
                            hundred: 0
                        };
    
                        marksData.forEach(student => {
                            if (!student.marks || student.marks.length === 0) return;
    
                            const isAbsent = student.absent?.some(absent => absent === true);
                            if (isAbsent) {
                                sectionAbsent++;
                                return;
                            }
    
                            sectionPresent++;
    
                            const totalMarks = student.marks.reduce((sum, mark) => sum + (typeof mark === "number" ? mark : 0), 0);
                            const percentage = (totalMarks / (student.marks.length * 100)) * 100;
                            const hasFailed = student.marks.some(mark => mark < 35);
    
                            if (hasFailed) {
                                sectionFails++;
                            } else {
                                sectionPasses++;
                            }
    
                            // Categorize based on percentage (for all present students)
                            if (percentage <= 35) {
                                sectionPercentageRanges.between0And35++;
                            } else if (percentage <= 60) {
                                sectionPercentageRanges.between36And60++;
                            } else if (percentage <= 80) {
                                sectionPercentageRanges.between61And80++;
                            } else if (percentage <= 90) {
                                sectionPercentageRanges.between81And90++;
                            } else if (percentage <= 99) {
                                sectionPercentageRanges.between91And99++;
                            } else if (percentage === 100) {
                                sectionPercentageRanges.hundred++;
                            }
                        });
    
                        totalStudents += sectionTotal;
                        absentStudents += sectionAbsent;
                        presentStudents += sectionPresent;
                        totalPasses += sectionPasses;
                        totalFails += sectionFails;
    
                        Object.keys(sectionPercentageRanges).forEach(range => {
                            percentageRanges[range] += sectionPercentageRanges[range];
                        });
    
                        sectionReports.push({
                            section,
                            total: sectionTotal,
                            present: sectionPresent,
                            absent: sectionAbsent,
                            passes: sectionPasses,
                            fails: sectionFails,
                            passPercentage: sectionPresent > 0 ? ((sectionPasses / sectionPresent) * 100).toFixed(2) : "0.00",
                            percentageRanges: sectionPercentageRanges
                        });
                    })
            )
        ).then(() => {
            reportTableBody.innerHTML = "";
            sectionReports.forEach(sectionReport => {
                if (sectionReport) {
                    reportTableBody.innerHTML += `
                        <tr>
                            <td>${sectionReport.section}</td>
                            <td>${sectionReport.total}</td>
                            <td>${sectionReport.present}</td>
                            <td>${sectionReport.absent}</td>
                            <td>${sectionReport.passes}</td>
                            <td>${sectionReport.fails}</td>
                            <td>${sectionReport.passPercentage}%</td>
                        </tr>
                    `;
                }
            });
    
            const overallPassPercentage = presentStudents > 0 ? ((totalPasses / presentStudents) * 100).toFixed(2) : "0.00";
    
            document.getElementById("summary").innerHTML = `
                <p><strong>Class: ${selectedClass}, Exam Type: ${examType}</strong></p>
                <p>Total Students: ${totalStudents}</p>
                <p>Present Students: ${presentStudents}</p>
                <p>Absent Students: ${absentStudents}</p>
                <p>Total Passes: ${totalPasses}</p>
                <p>Total Fails: ${totalFails}</p>
                <p>Overall Pass Percentage: ${overallPassPercentage}%</p>
            `;
    
            document.getElementById("percentage-ranges").innerHTML = `
                <h3>Overall Percentage Analyzer</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Section</th>
                            <th>Present Students</th>
                            <th>0% - 35%</th>
                            <th>36% - 60%</th>
                            <th>61% - 80%</th>
                            <th>81% - 90%</th>
                            <th>91% - 99%</th>
                            <th>100%</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sectionReports.map(sectionReport => `
                            <tr>
                                <td>${sectionReport.section}</td>
                                <td>${sectionReport.present}</td>
                                <td>${sectionReport.percentageRanges.between0And35}</td>
                                <td>${sectionReport.percentageRanges.between36And60}</td>
                                <td>${sectionReport.percentageRanges.between61And80}</td>
                                <td>${sectionReport.percentageRanges.between81And90}</td>
                                <td>${sectionReport.percentageRanges.between91And99}</td>
                                <td>${sectionReport.percentageRanges.hundred}</td>
                            </tr>
                        `).join('')}
                        <tr>
                            <td><strong>Total</strong></td>
                            <td><strong>${presentStudents}</strong></td>
                            <td><strong>${percentageRanges.between0And35}</strong></td>
                            <td><strong>${percentageRanges.between36And60}</strong></td>
                            <td><strong>${percentageRanges.between61And80}</strong></td>
                            <td><strong>${percentageRanges.between81And90}</strong></td>
                            <td><strong>${percentageRanges.between91And99}</strong></td>
                            <td><strong>${percentageRanges.hundred}</strong></td>
                        </tr>
                    </tbody>
                </table>
            `;
        }).catch(error => {
            console.error(error);
            alert("Error fetching data. Please try again.");
        });
    }
    </script>
