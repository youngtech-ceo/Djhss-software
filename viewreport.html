function generateReport(marks, selectedClass, selectedSection, examType) {
    const schoolName = "DIAMOND JUBILEE HIGHER SECONDARY SCHOOL";
    const totalStudents = marks.length;

    let passes = 0;
    let fails = 0;
    let absents = 0;

    // Calculate overall class averages, pass percentages, etc.
    const averageMarks = totalStudents ? (marks.reduce((sum, { total }) => sum + total, 0) / totalStudents).toFixed(2) : 0;
    const passPercentage = totalStudents ? ((passes / totalStudents) * 100).toFixed(2) : 0;

    let subjects;
    // Define subjects based on the class and section
    if (selectedClass <= 10) {
        subjects = ["TAMIL", "ENGLISH", "MATHS", "SCIENCE", "SOCIAL SCIENCE"];
    } else if (selectedClass >= 11) {
        if (selectedSection === 'A') {
            subjects = ["TAMIL", "ENGLISH", "MATHS", "PHYSICS", "CHEMISTRY", "BIOLOGY"];
        }
        if (selectedSection === 'A1') {
            subjects = ["TAMIL", "ENGLISH", "MATHS", "PHYSICS", "CHEMISTRY", "COMPUTER_SCIENCE"];
        }
        if (selectedSection === 'B') {
            subjects = ["TAMIL", "ENGLISH", "MATHS", "PHYSICS", "CHEMISTRY", "COMPUTER_SCIENCE"];
        }
        if (selectedSection === 'C') {
            subjects = ["TAMIL", "ENGLISH", "MATHS", "PHYSICS", "CHEMISTRY", "BIOLOGY"];
        }
        if (selectedSection === 'D') {
            subjects = ["TAMIL", "ENGLISH", "HISTORY", "ECONOMICS", "COMMERCE", "ACCOUNTS"];
        }
        if (selectedSection === 'E') {
            subjects = ["TAMIL", "ENGLISH", "ECONOMICS", "COMMERCE", "ACCOUNTS", "COMPUTER_APPLICATION"];
        }
        if (selectedSection === 'F') {
            subjects = ["TAMIL", "ENGLISH", "BIOLOGY", "AGRI", "AGRI_PRACTICAL", "EMPS"];
        }
    }

    // Initialize subject-wise tracking variables
    const subjectTotals = new Array(subjects.length).fill(0);
    const subjectPasses = new Array(subjects.length).fill(0);
    const subjectFails = new Array(subjects.length).fill(0);
    const subjectAbsents = new Array(subjects.length).fill(0);
    const gradeCounts = subjects.map(() => ({ A: 0, B: 0, C: 0, D: 0 }));

    // Initialize analysis for failure in only one subject
    const failureSubjectAnalysis = new Array(subjects.length).fill(0); // For students failing only one subject
    const failureCountByNumberOfSubjects = new Array(subjects.length + 1).fill(0); // Track number of subjects failed

    // Initialize counters for overall percentage ranges
    const percentageRanges = {
        below35: 0,
        between36And60: 0,
        between61And80: 0,
        between81And90: 0,
        between91And99: 0,
        hundred: 0
    };
    marks.forEach(student => {
        const studentMarks = student.marks || [];
        let failCount = 0; // Initialize failCount for the student
        let totalMarks = 0;
        let isAbsentForClass = false; // Track if student is absent for any subject
        let allPassed = true; // Track if student passes all subjects
        let failedSubjects = [];

        studentMarks.forEach((mark, index) => {
            if (mark === "absent") {
                subjectAbsents[index]++;
                isAbsentForClass = true;
            } else if (typeof mark === "number" && !isNaN(mark)) {
                subjectTotals[index] += mark;
                totalMarks += mark;

                if (mark < 35) {
                    subjectFails[index]++;
                    failCount++;
                    failedSubjects.push(subjects[index]);
                    allPassed = false;
                } else {
                    subjectPasses[index]++;
                }

                if (mark >= 60) gradeCounts[index].A++;
                else if (mark >= 40 && mark <= 59) gradeCounts[index].B++;
                else if (mark >= 26 && mark <= 39) gradeCounts[index].C++;
                else if (mark <= 25) gradeCounts[index].D++;
                else gradeCounts[index].D++;
            }
        });
        // Only update failure data if the student is not absent
        if (failCount !== "Absent") {
            if (!isAbsentForClass) {
                // Update failure count by the number of subjects failed (only if student is not absent)
                failureCountByNumberOfSubjects[failCount]++;
                
                // If the student failed only one subject, track it in the failureSubjectAnalysis
                if (failCount === 1) {
                    const failedSubjectIndex = subjects.indexOf(failedSubjects[0]);
                    failureSubjectAnalysis[failedSubjectIndex]++;
                }
            }

            // If the student is absent for any subject, mark as "Absent"
            if (isAbsentForClass) {
                student.status = "Absent";
                failCount = "Absent";
                absents++;
            } else {
                // Otherwise, set status based on if student passed all subjects
                student.status = allPassed ? "Pass" : "Fail";
            }
        }

        student.totalMarks = totalMarks;  // Add total marks to student object
        student.failCount = failCount; // Store fail count in student object

        const percentage = (totalMarks / (subjects.length * 100)) * 100;

        if (percentage < 35) {
            percentageRanges.below35++;
        } else if (percentage >= 36 && percentage <= 60) {
            percentageRanges.between36And60++;
        } else if (percentage >= 61 && percentage <= 80) {
            percentageRanges.between61And80++;
        } else if (percentage >= 81 && percentage <= 90) {
            percentageRanges.between81And90++;
        } else if (percentage >= 91 && percentage <= 99) {
            percentageRanges.between91And99++;
        } else if (percentage === 100) {
            percentageRanges.hundred++;
        }
    });

    // Update pass and fail counts excluding absentees
    passes = marks.filter(student => student.status === "Pass").length;
    fails = marks.filter(student => student.status === "Fail").length;

    const subjectAverages = subjectTotals.map((total, index) =>
        (total / (totalStudents - subjectAbsents[index])).toFixed(2)
    );

    const subjectPassPercentages = subjectPasses.map((passCount, index) => {
        const totalStudentsForSubject = totalStudents - subjectAbsents[index];
        return totalStudentsForSubject > 0 ? ((passCount / totalStudentsForSubject) * 100).toFixed(2) : 0;
    });

    const subjectPresent = subjectAbsents.map(absentCount => totalStudents - absentCount);

    function getGradeAndColor(mark) {
        if (mark === "Absent") return { grade: "Absent", color: "gray" };
        if (mark <= 25) return { grade: "D", color: "red" };
        if (mark >= 26 && mark <= 39) return { grade: "C", color: "orange" };
        if (mark >= 40 && mark <= 59) return { grade: "B", color: "blue" };
         if (mark >= 60 ) return { grade: "A", color: "green" };
        return { grade: "A", color: "green" };
    }

    // Sort students based on total marks in descending order and assign ranks
    let sortedStudents = marks.filter(student => student.status === "Pass").sort((a, b) => b.totalMarks - a.totalMarks);

    // Assign ranks
    sortedStudents.forEach((student, index) => {
        student.rank = index + 1;  // Rank starts from 1
    });

    // Calculate overall class percentage
    const totalPresentStudents = marks.filter(student =>
        student.marks.every(mark => mark !== "absent")
    ).length; // Calculate overall class percentage
    const overallClassPercentage = totalPresentStudents
        ? ((passes / totalPresentStudents) * 100).toFixed(2)
        : 0;

    // Generate the report HTML
    const reportContainer = document.getElementById("report-container");
    reportContainer.innerHTML = `
        <table>
            <tbody>
                <tr>
                    <th colspan="6">SCHOOL: ${schoolName}</th>
                    <th colspan="6">EXAM TYPE: ${examType}</th>
                </tr>
                <tr><th colspan="12">Overall Pass Percentage: ${overallClassPercentage}%</th></tr>
                <tr>
                    <th>Class</th><td>${selectedClass}</td>
                    <th>Section</th><td>${selectedSection}</td>
                    <th>Total Students</th><td>${totalStudents}</td>
                    <th>Pass Candidates</th><td>${passes}</td>
                    <th>Fail Candidates</th><td>${fails}</td>
                    <th>Absent Students</th><td>${absents}</td>
                </tr>
                <tr><th colspan="12"></th></tr>
            </tbody>
            <tbody>
                <tr>
                    <th>Student Name</th>
                    ${subjects.map(subject => `<th>${subject}</th>`).join('')}
                    <th>Total Marks</th>
                    <th>Percentage</th>
                    <th>Status</th>
                    <th>Fail Count</th>
                    <th>Rank</th>
                </tr>
                ${marks.map(({ name, marks: studentMarks, total, status, rank, failCount }) => {
                    const percentage = (total / (subjects.length * 100)) * 100;
                    return `
                        <tr>
                            <td>${name}</td>
                            ${studentMarks.slice(0, subjects.length).map((mark, index) => {
                                const { grade, color } = getGradeAndColor(mark);
                                return `<td style="color: ${color};">${mark === "absent" ? "Absent" : `${mark} (${grade})`}</td>`;
                            }).join('')}
                            <td>${total}</td>
                            <td>${percentage.toFixed(2)}%</td>
                            <td>${status}</td>
                            <td>${failCount}</td>
                            <td>${rank || 'N/A'}</td>
                        </tr>
                    `;
                }).join('')}
                
                <tr><th colspan="12">Subject Wise Analysis</th></tr>
                <tr>
                    <th>Subject</th><th>Teacher Name</th><th>Absent Count</th><th>Present Count</th>
                    <th>Total Students Passed</th><th>Fail Count</th><th>Average Marks</th>
                    <th>Pass Percentage</th><th>A Grade</th><th>B Grade</th><th>C Grade</th><th>D Grade</th>
                </tr>
                ${subjects.map((subject, index) => {
                    const teacherName = teacherNames[selectedClass]?.[selectedSection]?.[subject] || "Not Assigned";
                    return `
                        <tr>
                            <td>${subject}</td>
                            <td>${teacherName}</td>
                            <td>${subjectAbsents[index]}</td>
                            <td>${subjectPresent[index]}</td>
                            <td>${subjectPasses[index]}</td>
                            <td>${subjectFails[index]}</td>
                            <td>${subjectAverages[index]}</td>
                            <td>${subjectPassPercentages[index]}%</td>
                            <td>${gradeCounts[index].A}</td>
                            <td>${gradeCounts[index].B}</td>
                            <td>${gradeCounts[index].C}</td>
                            <td>${gradeCounts[index].D}</td>
                        </tr>
                    `;
                }).join('')}
            </tbody>
        </table>
        <h3>Failure Distribution</h3>
        <table>
            <tbody>
                <tr>
                    <th>Subject</th>
                    <th>Number of Students Failing Due to This Subject</th>
                    <th>Number of Subjects Failed</th>
                    <th>Number of Students</th>
                </tr>
            </tbody>
            <tbody>
                ${subjects.map((subject, index) => {
                    return `
                        <tr>
                            <td>${subject}</td>
                            <td>${failureSubjectAnalysis[index]}</td>
                            <td>No of Fail in ${index + 1} Subject</td>
                            <td>${failureCountByNumberOfSubjects[index + 1]}</td>
                        </tr>
                    `;
                }).join('')}
            </tbody>
        </table>
       
    `;
}
