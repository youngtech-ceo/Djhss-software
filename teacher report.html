<script>
  function fetchTeacherReport() {
    const examType = document.getElementById("exam-type").value;
    const selectedClass = document.getElementById("class-select").value;

    if (!examType) {
        alert("Please select an exam type.");
        return;
    }

    const teacherReportContainer = document.getElementById("teacher-report-container");
    teacherReportContainer.innerHTML = "<p>Loading...</p>";

    let consolidatedData = {};

    // Define subject order preference
    const generalSubjectOrder = [
        "TAMIL", "ENGLISH", "MATHS", "SCIENCE", "SOCIAL SCIENCE",
        "PHYSICS", "CHEMISTRY", "BIOLOGY", "COMPUTER_SCIENCE",
        "ECONOMICS",  "ACCOUNTS","COMMERCE", "HISTORY", 
        "COMPUTER_APPLICATION", "AGRI", "EMPS", "AGRI_PRACTICAL"
    ];

    Promise.all(
        Object.keys(teachers).map(classKey => {
            if (selectedClass && classKey !== selectedClass) return Promise.resolve();

            return Promise.all(
                Object.keys(teachers[classKey]).map(sectionKey => {
                    const teacherData = teachers[classKey][sectionKey];
                    const subjects = getSubjects(classKey, sectionKey);

                    return Promise.all(
                        subjects.map(subject => {
                            const teacherName = teacherData[subject];

                            if (!teacherName) return Promise.resolve(); // Skip if no teacher assigned

                            return database.ref(`students/${classKey}/${sectionKey}/${examType}`).once("value")
                                .then(snapshot => {
                                    const marksData = snapshot.val();
                                    if (!marksData) return null;

                                    let totalStudents = marksData.length || 0;
                                    let presentStudents = 0;
                                    let absentStudents = 0;
                                    let passes = 0;
                                    let fails = 0;
                                    let totalMarks = 0;

                                    marksData.forEach(student => {
                                        const subjectMarks = student.marks[subjects.indexOf(subject)] || 0;
                                        const isAbsent = student.absent[subjects.indexOf(subject)] || false;

                                        if (isAbsent) {
                                            absentStudents++;
                                        } else {
                                            presentStudents++;
                                            if (subjectMarks < 35) {
                                                fails++;
                                            } else {
                                                passes++;
                                            }
                                            totalMarks += subjectMarks;
                                        }
                                    });

                                    let averageMarks = totalStudents > 0 ? (totalMarks / totalStudents).toFixed(2) : "0.00";

                                    if (!consolidatedData[subject]) {
                                        consolidatedData[subject] = {};
                                    }

                                    if (!consolidatedData[subject][teacherName]) {
                                        consolidatedData[subject][teacherName] = {};
                                    }

                                    if (!consolidatedData[subject][teacherName][classKey]) {
                                        consolidatedData[subject][teacherName][classKey] = {
                                            sections: [],
                                            totalStudents: 0,
                                            totalPresent: 0,
                                            totalAbsent: 0,
                                            totalPass: 0,
                                            totalFail: 0,
                                            totalMarks: 0
                                        };
                                    }

                                    consolidatedData[subject][teacherName][classKey].sections.push(sectionKey);
                                    consolidatedData[subject][teacherName][classKey].totalStudents += totalStudents;
                                    consolidatedData[subject][teacherName][classKey].totalPresent += presentStudents;
                                    consolidatedData[subject][teacherName][classKey].totalAbsent += absentStudents;
                                    consolidatedData[subject][teacherName][classKey].totalPass += passes;
                                    consolidatedData[subject][teacherName][classKey].totalFail += fails;
                                    consolidatedData[subject][teacherName][classKey].totalMarks += parseFloat(averageMarks) * totalStudents;
                                });
                        })
                    );
                })
            );
        })
    )
    .then(() => {
        let consolidateTableHTML = `
            <h3>Consolidated Report</h3>
            <table border="1">
                <thead>
                    <tr>
                        <th>S.No</th>
                      
                        <th>Teacher Name</th>
                          <th>Subject</th>
                        <th>Standard</th>
                        <th>Sections</th>
                        <th>Total Students</th>
                        <th>Total Present</th>
                        <th>Total Absent</th>
                        <th>Total Passes</th>
                        <th>Total Fails</th>
                        <th>Overall Pass Percentage</th>
                        <th>Average Marks</th>
                    </tr>
                </thead>
                <tbody>
        `;

        let serialNo = 1;

        // Sort by subject order
        generalSubjectOrder.forEach(subject => {
            if (consolidatedData[subject]) {
                Object.keys(consolidatedData[subject]).forEach(teacherName => {
                    Object.keys(consolidatedData[subject][teacherName]).forEach(classKey => {
                        const subjectSummary = consolidatedData[subject][teacherName][classKey];
                        const overallPassPercentage = subjectSummary.totalPresent > 0 ? ((subjectSummary.totalPass / subjectSummary.totalPresent) * 100).toFixed(2) : "0.00";
                        const averageMarks = subjectSummary.totalStudents > 0 ? (subjectSummary.totalMarks / subjectSummary.totalStudents).toFixed(2) : "0.00";

                        consolidateTableHTML += `
                            <tr>
                                <td>${serialNo++}</td>
                             
                                <td>${teacherName}</td>
                                   <td>${subject}</td>
                                <td>${classKey}</td>
                                <td>${[...new Set(subjectSummary.sections)].join(", ")}</td>
                                <td>${subjectSummary.totalStudents}</td>
                                <td>${subjectSummary.totalPresent}</td>
                                <td>${subjectSummary.totalAbsent}</td>
                                <td>${subjectSummary.totalPass}</td>
                                <td>${subjectSummary.totalFail}</td>
                                <td>${overallPassPercentage}%</td>
                                <td>${averageMarks}</td>
                            </tr>
                        `;
                    });
                });
            }
        });

        consolidateTableHTML += "</tbody></table>";

        teacherReportContainer.innerHTML = consolidateTableHTML;
    })
    .catch(error => {
        console.error(error);
        alert("Error fetching data. Please try again.");
    });
}

</script>

<div id="teacher-report-container"></div>
<div id="teacher-report-container"></div>


<script>
function printReport() {
    const originalContents = document.body.innerHTML; // Save original content
    const printContents = document.getElementById("teacher-report-container").innerHTML; // Get only the report

    document.body.innerHTML = `
        <style>
            @page {
                size: A4 landscape;
                margin: 10mm;
            }
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                margin: 0;
                padding: 0;
                background-color: white; /* Ensure no background color behind the table */
                font-family: Arial, sans-serif;
            }
            .print-container {
                width: 100%;
                display: flex;
                justify-content: center;
                padding: 0;
            }
            .print-content {
                width: 100%;
                max-width: 100%;
                transform: scale(1); /* Default 100% scale */
                padding: 0;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed; /* Ensure table fills the page */
            }
            th, td {
                border: 1px solid black;
                padding: 8px;
                text-align: center;
                word-wrap: break-word;
                font-size: 12pt; /* Default text size */
            }
            /* Scale table down dynamically if needed */
            @media print {
                .print-content {
                    transform: scale(0.9); /* Adjust size to fit on page */
                }
                table {
                    width: 100%;
                    table-layout: fixed; /* Make sure table expands fully */
                }
                th, td {
                    font-size: 10pt; /* Slightly smaller font size for printing */
                    padding: 6px;
                }
            }
        </style>
        <div class="print-container">
            <div class="print-content">
                ${printContents}
            </div>
        </div>
    `;

    window.print(); // Open print settings

    document.body.innerHTML = originalContents; // Restore original content after printing
}



</script>
</div>
