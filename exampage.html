            } else if (window.innerWidth <= 768 && window.innerWidth > 480) {

            }

  <script>
    classSelect.addEventListener("change", (e) => {
    const selectedClass = parseInt(e.target.value);
    sectionSelect.style.display = "inline";

    let subjects;
    if (selectedClass <= 10) {
      subjects = ["TAMIL", "ENGLISH", "MATHS", "SCIENCE", "SOCIAL SCIENCE"];
    } else if (selectedClass >= 11) {
        if (selectedSection === 'A') {
            subjects = ["TAMIL", "ENGLISH", "MATHS", "PHYSICS", "CHEMISTRY", "BIOLOGY"];
        }  if (selectedSection === 'A1') {
            subjects = ["TAMIL", "ENGLISH", "MATHS","PHYSICS", "CHEMISTRY", "COMPUTER_SCIENCE" ];
        } if (selectedSection === 'B') {

        } if (selectedSection === 'C') {

        } if (selectedSection === 'D') {
            subjects = ["TAMIL", "ENGLISH",  "HISTORY","ECONOMICS", "COMMERCE", "ACCOUNTS"];
        } if (selectedSection === 'E') {
            subjects = ["TAMIL", "ENGLISH", "ECONOMICS", "COMMERCE", "ACCOUNTS", "COMPUTER_APPLICATION"];
        } if (selectedSection === 'F') {
            subjects = ["TAMIL", "ENGLISH", "BIOLOGY","AGRI", "AGRI_PRACTICLE",  "EMPS"];
        }
     }
    subjectSelect.innerHTML = '<option value="">Select Subject</option>';
    subjects.forEach(subject => {
        const option = document.createElement("option");
        option.value = subject;
        option.textContent = subject;
        subjectSelect.appendChild(option);
    });

    clearPreviousResults();
});

sectionSelect.addEventListener("change", (e) => {

        } if (selectedSection === 'F') {
            subjects = ["TAMIL", "ENGLISH", "BIOLOGY","AGRI", "AGRI_PRACTICLE",  "EMPS"];

     }
    // Create the table header

selectedStudents.forEach(student => {

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "absent-checkbox"; // Add a class for easier selection later
        checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
                input.value = "00"; // Mark as absent
                input.disabled = true; // Disable input if absent
            } else {
                input.disabled = false; // Enable input if not absent
                input.value = ""; // Clear the input if the checkbox is unchecked
            }
        });

        cell.appendChild(input);
        cell.appendChild(checkbox);
        row.appendChild(cell);
    });

    // Total marks cell
    const totalCell = document.createElement("td");
    totalCell.className = "total";

    row.appendChild(totalCell);

});

    document.getElementById("student-list-container").appendChild(studentListTable);
    infoDiv.style.visibility = "hidden";




 
    fetchStudentMarks(selectedClass, selectedSection);

    function fetchStudentMarks(selectedClass, selectedSection) {
    const examType = document.getElementById("exam-type").value;
    const classRef = database.ref(`students/${selectedClass}/${selectedSection}/${examType}`);
    
    classRef.once('value')
        .then(snapshot => {
            const data = snapshot.val();
            console.log(data); // Debug

            if (data) {
                const rows = document.querySelectorAll("#student-list-container tr:not(:first-child)");

                rows.forEach(row => {
                    const studentName = row.cells[0].textContent.trim();
                    const studentData = data.find(student => student.name === studentName);

                    if (studentData) {
                        const inputs = row.querySelectorAll("input[type='number']");
                        const checkboxes = row.querySelectorAll(".absent-checkbox");

                        // Loop through each subject
                        studentData.marks.forEach((mark, index) => {
                            if (mark === "00") {
                                inputs[index].value = ""; // Leave mark empty if absent
                            } else {
                                inputs[index].value = mark; // Set the mark
                            }
                        });

                        studentData.absent.forEach((isAbsent, index) => {
                            if (checkboxes[index]) {
                                checkboxes[index].checked = !!isAbsent; // Set checkbox status
                            }
                        });

                        // Set total
                        const totalCell = row.querySelector(".total");
                        if (totalCell) {
                            totalCell.textContent = studentData.total;
                        }
                    }
                });
            }
        })
        .catch(error => {
            console.error("Error fetching data: ", error);
            alert("Error fetching data: " + error.message);
        });
}
});






function fetchStudentAbsence(selectedClass, selectedSection) {
    const examType = document.getElementById("exam-type").value; // Get selected exam type
    const classRef = database.ref(`students/${selectedClass}/${selectedSection}/${examType}`); // Firebase reference path for fetching data
    
    classRef.once('value').then(snapshot => {
        const data = snapshot.val(); // Get the data from Firebase
        console.log(data); // Debugging: Log the fetched data

        if (data) {
            const rows = document.querySelectorAll("#student-list-container tr:not(:first-child)"); // All student rows (excluding the header)

            rows.forEach(row => {
                const studentName = row.cells[0].textContent.trim(); // Get student name from the table
                const studentData = data.find(student => student.name === studentName); // Find student data by name

                if (studentData) {
                    const checkboxes = row.querySelectorAll(".absent-checkbox"); // Get all checkboxes for that row (subjects)

                    // Loop through each subject and its corresponding checkbox
                    studentData.absent.forEach((isAbsent, index) => {
                        const checkbox = checkboxes[index]; // Get the checkbox for the current subject
                        if (checkbox) {
                            checkbox.checked = isAbsent; // Set the checkbox based on absence (true = checked, false = unchecked)
                        }
                    });
                }
            });
        }
    }).catch(error => {
        console.error("Error fetching data: ", error);
    });
}





</script>

<!-- Popup message container -->
<div id="popup-message" class="hidden"></div>



<script>
document.getElementById("submit-button").addEventListener("click", () => {
    const examType = document.getElementById("exam-type").value;
    const rows = document.querySelectorAll("#student-list-container table tr:not(:first-child)");
    const selectedClass = parseInt(classSelect.value);
    const selectedSection = sectionSelect.value;
    const classRef = database.ref(`students/${selectedClass}/${selectedSection}/${examType}`);

    const studentsData = [];

    rows.forEach(row => {
        const inputs = row.querySelectorAll("input[type='number']");
        const checkboxes = row.querySelectorAll(".absent-checkbox");
        const totalCell = row.querySelector(".total");
        let total = 0;
        const studentName = row.cells[0].textContent.trim();
        const subjectMarks = [];
        const absentState = [];

        inputs.forEach((input, index) => {
            let mark = parseInt(input.value) || 0;
            const isAbsent = checkboxes[index].checked;

            if (isAbsent) {
                mark = 0;
                subjectMarks.push("absent");
                absentState.push(true);
            } else {
                subjectMarks.push(mark);
                absentState.push(false);
            }

            total += mark;
        });

        studentsData.push({
            name: studentName,
            marks: subjectMarks,
            absent: absentState,
            total: total
        });

        totalCell.textContent = total;
    });

    classRef.set(studentsData)
        .then(() => {
            showPopupMessage("✅ Marks stored successfully!", true);
        })
        .catch((error) => {
            console.error("Error saving data: ", error);
            showPopupMessage("❌ Failed to save marks!", false);
        });
});

function showPopupMessage(message, isSuccess) {
    const popup = document.getElementById("popup-message");
    popup.textContent = message;
    popup.className = isSuccess ? "popup-success" : "popup-error";
    popup.classList.add("show");
    popup.classList.remove("hidden");

    // Hide after 3 seconds
    setTimeout(() => {
        popup.classList.remove("show");
        setTimeout(() => popup.classList.add("hidden"), 400);
    }, 3000);
}
</script>
