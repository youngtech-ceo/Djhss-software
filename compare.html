  <script>

    document.getElementById("compare-button").addEventListener("click", () => {
    const examType1 = document.getElementById("exam-type-1").value; // Get selected Exam Type 1
    const examType2 = document.getElementById("exam-type-2").value; // Get selected Exam Type 2
    const selectedClass = parseInt(document.getElementById("compare-class").value); // Get selected Class
    const selectedSection = document.getElementById("compare-section").value; // Get selected Section
    const teacher = teacherNames[selectedClass][selectedSection];
    
    // Ensure all fields are selected
    if (!examType1 || !examType2 || !selectedClass || !selectedSection) {
        alert("Please select all fields to compare exams.");
        return;
    }

    // Show the comparison container when the compare button is clicked
    const comparisonContainer = document.getElementById("comparison-container");
    comparisonContainer.style.visibility = "visible";
    comparisonContainer.innerHTML = "<h3>Loading Comparison...</h3>"; // Placeholder while loading data

    const classRef1 = database.ref(`students/${selectedClass}/${selectedSection}/${examType1}`); // Reference for Exam Type 1
    const classRef2 = database.ref(`students/${selectedClass}/${selectedSection}/${examType2}`); // Reference for Exam Type 2

    // Fetch the data for both exam types
    Promise.all([classRef1.once('value'), classRef2.once('value')])
        .then(([snapshot1, snapshot2]) => {
            const data1 = snapshot1.val(); // Data for examType1
            const data2 = snapshot2.val(); // Data for examType2

            if (data1 && data2) {
                // Now generate the comparison table
                generateComparisoncontainer(data1, data2, examType1, examType2, selectedClass, selectedSection, teacher); // Correct function call
            } else {
                console.error("Data not found for the selected exams.");
                alert("Data not found for the selected exams.");
                comparisonContainer.innerHTML = "<h3>No data found for the selected exams.</h3>";
            }
        })
        .catch((error) => {
            console.error("Error fetching data: ", error);
            comparisonContainer.innerHTML = "<h3>Error fetching data. Please try again.</h3>";
        });
});






function generateComparisoncontainer(data1, data2, examType1, examType2, selectedClass, selectedSection, teacherName) {



  const schoolName = "DIAMOND JUBILEE HIGHER SECONDARY SCHOOL";
    const comparisonContainer = document.getElementById("comparison-container");

    // Define the subjects based on the class and section
    let subjects;
    if (selectedClass <= 10) {
        subjects = ["TAMIL", "ENGLISH", "MATHS", "SCIENCE", "SOCIAL SCIENCE"];
    } else if (selectedClass >= 11) {
        if (selectedSection === 'A') {
            subjects = ["TAMIL", "ENGLISH", "MATHS", "PHYSICS", "CHEMISTRY", "BIOLOGY"];
        } else if (selectedSection === 'A1') {
            subjects = ["TAMIL", "ENGLISH", "MATHS", "PHYSICS", "CHEMISTRY", "COMPUTER SCIENCE"];
        } else if (selectedSection === 'B') {
            subjects = ["TAMIL", "ENGLISH", "MATHS", "BIOLOGY", "CHEMISTRY", "COMPUTER SCIENCE"];
        } else if (selectedSection === 'C') {
            subjects = ["TAMIL", "ENGLISH", "MATHS", "PHYSICS", "CHEMISTRY", "BIOLOGY"];
        } else if (selectedSection === 'D') {
            subjects = ["TAMIL", "ENGLISH", "ECONOMICS", "COMMERCE", "ACCOUNTS", "HISTORY"];
        } else if (selectedSection === 'E') {
            subjects = ["TAMIL", "ENGLISH", "ECONOMICS", "COMMERCE", "ACCOUNTS", "COMPUTER APPLICATION"];
        } else if (selectedSection === 'F') {
            subjects = ["TAMIL", "ENGLISH", "AGRI", "BIOLOGY", "EMPS", "AGRI_PRACTICLE"];
        }
    }

    // Process data to calculate grade counts and other analysis for each subject
    const calculateSubjectAnalysis = (data) => {
        const gradeCounts = subjects.map(() => ({ A: 0, B: 0, C: 0, D: 0 }));
        const subjectTotals = new Array(subjects.length).fill(0);
        const subjectFails = new Array(subjects.length).fill(0);
        const subjectAbsents = new Array(subjects.length).fill(0);
        const subjectPresents = new Array(subjects.length).fill(0);
        const totalStudents = data.length;

        data.forEach(student => {
            const subjectMarks = student.marks || [];
            subjectMarks.forEach((mark, index) => {
                if (mark === "absent") {
                    subjectAbsents[index]++; // Increment absent count for the subject
                } else if (typeof mark === "number" && !isNaN(mark)) {
                    subjectTotals[index] += mark;
                    subjectPresents[index]++;  // Counting the student as present for this subject
                    if (mark < 35) subjectFails[index]++;
                    if (mark >= 71) gradeCounts[index].A++;
                    else if (mark >= 41) gradeCounts[index].B++;
                    else if (mark >= 26) gradeCounts[index].C++;
                    else gradeCounts[index].D++;
                }
            });
        });

        // Calculating Passes as Presents - Fails
        const subjectPasses = subjectPresents.map((present, index) => present - subjectFails[index]);

        const subjectAverages = subjectTotals.map((total, index) =>
            (total / subjectPresents[index]).toFixed(2)
        );

        const subjectPassPercentages = subjectPasses.map((passCount, index) => {
            return subjectPresents[index] > 0 ? ((passCount / subjectPresents[index]) * 100).toFixed(2) : 0;
        });

        return { gradeCounts, subjectAverages, subjectPassPercentages, subjectFails, subjectAbsents, subjectPresents, subjectPasses, totalStudents };
    };

    const analysis1 = calculateSubjectAnalysis(data1);
    const analysis2 = calculateSubjectAnalysis(data2);

    // Handle grade and color based on marks
    function getGradeAndColor(mark) {
        if (mark === "Absent") return { grade: "Absent", color: "gray" };
        if (mark < 25) return { grade: "D", color: "red" };
        if (mark >= 26 && mark <= 39) return { grade: "C", color: "orange" };
        if (mark >= 40 && mark <= 59) return { grade: "B", color: "blue" };
        return { grade: "A", color: "green" };
    }

    // Generate and display the comparison table
    let tableHTML = `
        
        <table class="comparison-table">
            <thead>
                <tr>
                    <th colspan="12">SCHOOL: ${schoolName}</th>
                  
                </tr>

                <tr> <th colspan="12">${examType1} vs ${examType2} Exam Comparison Report </th></tr>
                <tr>
                    <th>Class</th><td>${selectedClass}</td>
                    <th>Section</th><td>${selectedSection}</td>
                   
                   
                </tr>
                <tr><th colspan="12"></th></tr>
            </thead>
            <thead>
                <tr><th>Student Name</th>${subjects.map(subject => `<th colspan="2">${subject}</th>`).join('')}</tr>
                <tr><td></td>${subjects.map(() => `<th>${examType1}</th><th>${examType2}</th>`).join('')}</tr>
            </thead>
            <tbody>
    `;

    // Loop through students data to create the rows for comparison of marks
   // Loop through students data to create the rows for comparison of marks
data1.forEach(student1 => {
    const student2 = data2.find(student => student.name === student1.name);
    if (student2) {
        tableHTML += `
            <tr>
                <td style=" text-align: left;">${student1.name}</td>
                ${subjects.map((subject, index) => {
                    const mark1 = student1.marks ? student1.marks[index] || 0 : 0;
                    const mark2 = student2.marks ? student2.marks[index] || 0 : 0;
                    
                    // Get grade and color for both exam types
                    const { grade: grade1, color: color1 } = getGradeAndColor(mark1);
                    const { grade: grade2, color: color2 } = getGradeAndColor(mark2);
                    
                    // Return the <td> elements with the corresponding color class
                    return `
                        <td class="${color1}">${mark1} (${grade1})</td>
                        <td class="${color2}">${mark2} (${grade2})</td>
                    `;
                }).join('')}
            </tr>
        `;
    }
});


    tableHTML += `</tbody></table>`;

    // Grade Count Comparison for each subject
    tableHTML += `
    <br><br><br>
        <h4>Grade Counts Comparison</h4>
        <div class="grade-criteria">
  <h3>Mark to Grade Criteria</h3>
  <table>
    <thead>
      <tr>
        <th>Mark Range</th>
        <th>Grade</th>
      </tr>
    </thead>
    <tbody>
      <tr class="gradeD">
        <td>Less than 25</td>
        <td>D</td>
      </tr>
      <tr class="gradeC">
        <td>26 - 39</td>
        <td>C</td>
      </tr>
      <tr class="gradeB">
        <td>40 - 59</td>
        <td>B</td>
      </tr>
      <tr class="gradeA">
        <td>60 and above</td>
        <td>A</td>
      </tr>
    </tbody>
  </table>
</div>

        <table class="grade-counts">
             <thead>
                <tr><th>Subject</th>
                    <th colspan="4">${examType1}</th>
                    <th colspan="4">${examType2}</th>
                </tr>
                <tr>
                    <td></td>
                    <th>A</th><th>B</th><th>C</th><th>D</th>
                    <th>A</th><th>B</th><th>C</th><th>D</th>
                </tr>
            </thead>
            <tbody>
    `;

    subjects.forEach((subject, index) => {
        tableHTML += `
            <tr>
                <td>${subject}</td>
                <td>${analysis1.gradeCounts[index].A}</td>
                <td>${analysis1.gradeCounts[index].B}</td>
                <td>${analysis1.gradeCounts[index].C}</td>
                <td>${analysis1.gradeCounts[index].D}</td>
                <td>${analysis2.gradeCounts[index].A}</td>
                <td>${analysis2.gradeCounts[index].B}</td>
                <td>${analysis2.gradeCounts[index].C}</td>
                <td>${analysis2.gradeCounts[index].D}</td>
            </tr>
        `;
    });

    tableHTML += `</tbody></table>`;

    // Subject-wise comparison analysis
    tableHTML += `
        <h4>Subject Analysis Comparison</h4>
        <table class="subject-analysis">
            <thead>
                <tr><th colspan="2"></th>
                    <th colspan="7">${examType1}</th>
                    <th colspan="7">${examType2}</th>
                </tr>
                <tr><th>Subject</th>
                    <th>Teacher Name</th>
                    <th>Total Students</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Pass Count</th>
                    <th>Fail Count</th>
                    <th>Avg</th>
                    <th>Pass %</th>
                    <th>Total Students</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Pass Count</th>
                    <th>Fail Count</th>
                    <th>Avg</th>
                    <th>Pass %</th>
                </tr>
            </thead>
            <tbody>
    `;

    subjects.forEach((subject, index) => {
        const teacherName = teacherNames[selectedClass]?.[selectedSection]?.[subject] || "Not Assigned";
        tableHTML += `
            <tr>
                <td>${subject}</td>
                <td>${teacherName}</td>
                <td>${analysis1.totalStudents}</td>
                <td>${analysis1.subjectPresents[index]}</td>
                <td>${analysis1.subjectAbsents[index]}</td>
                <td>${analysis1.subjectPasses[index]}</td>
                <td>${analysis1.subjectFails[index]}</td>
                <td>${analysis1.subjectAverages[index]}</td>
                <td>${analysis1.subjectPassPercentages[index]}%</td>
                <td>${analysis2.totalStudents}</td>
                <td>${analysis2.subjectPresents[index]}</td>
                <td>${analysis2.subjectAbsents[index]}</td>
                <td>${analysis2.subjectPasses[index]}</td>
                <td>${analysis2.subjectFails[index]}</td>
                <td>${analysis2.subjectAverages[index]}</td>
                <td>${analysis2.subjectPassPercentages[index]}%</td>
            </tr>
        `;
    });

    tableHTML += `</tbody></table>`;

    // Insert the generated HTML into the container
    comparisonContainer.innerHTML = tableHTML;
}



</script>
